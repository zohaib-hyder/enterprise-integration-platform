name: enterprise-integration-release
x-backend: &backend
  image: enterprise-integration-phase12-api:local
  build: {context: ./backend}
  env_file: ${RELEASE_ENV_FILE:?Set RELEASE_ENV_FILE to a private release env file}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: ["/tmp:size=32m,mode=1777"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [application, database]
  mem_limit: 256m
  cpus: 0.5
  stop_grace_period: 45s
services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes: [release_database:/var/lib/postgresql/data]
    networks: [database]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    <<: *backend
    volumes: [release_private:/app/.local]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, container_health.py]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  worker:
    <<: *backend
    command: [python, -m, app.workers.runner, --poll-seconds, '0.5']
    environment:
      WORKER_HEALTH_FILE: /tmp/worker-id
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, container_health.py, worker]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 45s
  frontend:
    image: enterprise-integration-phase12-frontend:local
    build: {context: ./frontend}
    environment:
      BACKEND_URL: http://api:8000
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:?Set exact external origins}
    ports: ['127.0.0.1:${RELEASE_PORT:-3300}:3000']
    depends_on:
      api: {condition: service_healthy}
    networks: [application, edge]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 0.5
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
networks:
  edge: {}
  application: {internal: true}
  database: {internal: true}
volumes:
  release_database:
  release_private:
