name: Platform verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: integration
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: --health-cmd "pg_isready -U postgres -d integration" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/integration
      APP_ENV: test
      AI_OPENAI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements-dev.lock}
      - run: python -m pip install -r requirements-dev.lock
        working-directory: backend
      - run: ruff check backend scripts/phase11_*.py scripts/database_recovery.py scripts/setup_release.py scripts/setup_local.py scripts/release_demo.py scripts/release_recovery.py scripts/audit_publication.py scripts/verify_portfolio_docs.py scripts/prepare_portfolio_evidence.py
      - run: ruff format --check backend scripts/phase11_*.py scripts/database_recovery.py scripts/setup_release.py scripts/setup_local.py scripts/release_demo.py scripts/release_recovery.py scripts/audit_publication.py scripts/verify_portfolio_docs.py scripts/prepare_portfolio_evidence.py
      - run: alembic upgrade head && alembic check && pytest -q
        working-directory: backend
      - run: python -m app.ai.evaluation
        working-directory: backend
      - run: python -m pip install pip-audit && pip-audit -r requirements-dev.lock
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run lint && npm run typecheck && npm run build
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - name: Development advisories (tracked unresolved finding)
        continue-on-error: true
        run: npm audit --audit-level=high
        working-directory: frontend
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_DB: integration, POSTGRES_HOST_AUTH_METHOD: trust}
        ports: ['127.0.0.1:5432:5432']
        options: --health-cmd "pg_isready -U postgres -d integration" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/integration
      AI_OPENAI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements-dev.lock}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: python -m venv backend/.venv
      - run: .venv/bin/python -m pip install -r requirements-dev.lock
        working-directory: backend
      - run: .venv/bin/alembic upgrade head
        working-directory: backend
      - run: mkdir -p .local && PYTHONPATH=.:tests .venv/bin/python ../scripts/phase11_fixtures.py && PYTHONPATH=.:tests .venv/bin/python ../scripts/phase11_retry_fixture.py
        working-directory: backend
      - run: npm ci && npx playwright install --with-deps chromium && npm run build
        working-directory: frontend
      - name: Start isolated local servers
        run: |
          backend/.venv/bin/python scripts/phase11_server.py api > backend/.local/api.log 2>&1 &
          cd frontend
          mkdir -p .local
          npm start > .local/server.log 2>&1 &
      - name: Wait for readiness
        run: |
          backend/.venv/bin/python - <<'PY'
          import time,httpx
          for _ in range(60):
              try:
                  if httpx.get('http://127.0.0.1:8000/ready').status_code==200 and httpx.get('http://127.0.0.1:3000/login').status_code==200:break
              except httpx.HTTPError:pass
              time.sleep(1)
          else:raise SystemExit('Local services did not become ready')
          PY
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-browser-failures
          path: frontend/test-results
          retention-days: 3
